name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        # ignore-scripts avoids a native node-pty compile on the CI image.
        # Typecheck does not need the compiled addon.
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck
